documentation:
- changed-files:
  - any-glob-to-any-file:
    - docs/**/*
    - licenses/*
    - notebooks/**/*
    - .mailmap
    - .readthedocs.yaml
    - README.rst
    - LICENSE.rst
    - '*.md'
    - '*.cff'

testing:
- changed-files:
  - any-glob-to-any-file:
    - .github/workflows/*
    - jdaviz/conftest.py
    - jdaviz/tests/*
    - .bandit.yaml
    - .flake8
    - codecov.yml
    - conftest.py
    - '**/conftest.py'
    - tox.ini

plugin:
- changed-files:
  - any-glob-to-any-file:
    - '**/plugins/**/*'
    - '!**/plugins/viewers.py'

loaders:
- changed-files:
  - any-glob-to-any-file:
    - 'jdaviz/core/loaders/**/*'

subsets:
- changed-files:
  - any-glob-to-any-file:
    - 'jdaviz/configs/default/plugins/subset_*/**/*'

mosviz:
- changed-files:
  - any-glob-to-any-file:
    - jdaviz/configs/mosviz/**/*
