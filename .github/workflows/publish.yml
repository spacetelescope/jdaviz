name: Release

on:
  # NOTE: PR trigger is to ensure changes do not break packaging.
  pull_request:
  release:
    types: [released]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'release' }}

permissions:
  contents: read

jobs:
  # On release, wait for the CI run triggered by the release tag push and
  # require success. Only required jobs matter here.
  wait-for-ci:
    name: Wait for CI on release tag
    if: github.event_name == 'release' && github.repository == 'spacetelescope/jdaviz'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      TAG: ${{ github.ref_name }}
    steps:
    - name: Wait for CI run to complete
      id: wait
      run: |
        query="repos/$REPO/actions/workflows/ci_workflows.yml/runs?event=push&head_sha=$SHA&per_page=100"
        filter='[.workflow_runs[] | select(.head_branch == env.TAG)] | sort_by(.created_at) | last // empty'

        # Allow time for the tag push to register a CI run.
        for _ in $(seq 1 30); do
          run_id=$(gh api "$query" --jq "$filter | .id" || true)
          [ -n "$run_id" ] && break
          sleep 30
        done
        if [ -z "$run_id" ]; then
          echo "::error::No CI run found for tag $TAG ($SHA)."
          exit 1
        fi
        echo "Found CI run: https://github.com/$REPO/actions/runs/$run_id"

        while [ "$(gh api "repos/$REPO/actions/runs/$run_id" --jq .status)" != "completed" ]; do
          sleep 60
        done
        echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

    - name: Require CI run to succeed
      env:
        RUN_ID: ${{ steps.wait.outputs.run_id }}
      run: |
        conclusion=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .conclusion)
        if [ "$conclusion" != "success" ]; then
          echo "::error::CI run concluded '$conclusion': https://github.com/$REPO/actions/runs/$RUN_ID"
          exit 1
        fi
        echo "CI run succeeded."

  build-n-test:
    name: Build and test Python 🐍 distributions 📦
    runs-on: ubuntu-latest
    if: github.repository == 'spacetelescope/jdaviz'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Build pytestargs from labels
      id: build-pytestargs
      run: |
        pytestargs=""

        # Add --skip-remote-failures if 'skip-remote-failures' label is present
        if ${{ contains(github.event.pull_request.labels.*.name, 'skip-remote-failures') }}; then
          pytestargs="--skip-remote-failures"
        fi

        # Export as step output so later steps can reference it.
        echo "pytestargs=$pytestargs" >> $GITHUB_OUTPUT

    - name: Install python-build and twine
      run: python -m pip install build "twine>=3.3" "importlib_metadata!=8.0.0"

    - name: Build package
      run: python -m build --sdist --wheel .

    - name: List result
      run: ls -l dist

    - name: Check dist
      run: python -m twine check --strict dist/*

    - name: Get components for cache key
      id: date
      run: |
        echo "year=$(date +'%Y')" >> $GITHUB_OUTPUT
        echo "week=$(date +'%V')" >> $GITHUB_OUTPUT
        echo "day=$(date +'%j')" >> $GITHUB_OUTPUT

    - name: Restore MAST cache
      id: cache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./
        key: use-restore-keys-below-to-match-in-priority-order
        restore-keys: |
          mast-cache-${{ steps.date.outputs.year }}-${{ steps.date.outputs.week }}-${{ steps.date.outputs.day }}-
          mast-cache-${{ steps.date.outputs.year }}-${{ steps.date.outputs.week }}-
          mast-cache-${{ steps.date.outputs.year }}-
          mast-cache-

    - name: Move cache to working directory
      run: |
        # Check if any fits files exist and move them to the working directory
        if ls ./*.fits 1> /dev/null 2>&1; then
          mv ./*.fits "/home/runner/work/jdaviz/"
          echo "Files in working directory:"
          ls -la "/home/runner/work/jdaviz/"*.fits
        else
          echo "No .fits files found in cache - tests will download files as needed"
        fi

    - name: Test package
      run: |
        cd ..
        echo "pytest args ${{ steps.build-pytestargs.outputs.pytestargs }}"
        python -m venv testenv
        testenv/bin/pip install pytest pytest-astropy pytest-tornasync pytest-xdist pytest-split jdaviz/dist/*.whl
        # Run every group even if one fails, so all failures are reported at once.
        status=0
        for group in 1 2 3 4; do
          testenv/bin/pytest -p no:warnings -n auto --dist loadscope --splits 4 --group $group --durations-path=${{ github.workspace }}/jdaviz/pytest_utilities/.test_durations --astropy-header --remote-data --junitxml=${{ github.workspace }}/junit/group$group.xml ${{ steps.build-pytestargs.outputs.pytestargs }} --pyargs jdaviz || status=1
        done
        # Print one combined summary of all groups at the end of the log
        python ${{ github.workspace }}/.github/scripts/pytest_summary.py --title "Package tests" ${{ github.workspace }}/junit/group{1,2,3,4}.xml || true
        exit $status

    - name: Upload distribution artifacts
      if: github.event_name == 'release'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  # NOTE: Only runs on release, after CI and package tests have all passed.
  publish:
    name: Publish Python 🐍 distributions 📦 to PyPI
    needs: [ wait-for-ci, build-n-test ]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.repository == 'spacetelescope/jdaviz'

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      if: github.event_name == 'release'
      with:
        user: __token__
        password: ${{ secrets.PYPI_TOKEN }}
